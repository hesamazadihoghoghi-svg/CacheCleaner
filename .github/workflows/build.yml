name: Build Lenovo Tab M7 Cache Cleaner APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/example/cachecleaner
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CacheCleaner"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.cachecleaner'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.cachecleaner"
                  minSdk 26
                  targetSdk 28
                  versionCode 4
                  versionName "1.3"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <application
                  android:allowBackup="true"
                  android:label="پاک‌ساز کش لنوو"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CacheClearService"
                      android:exported="true"
                      android:label="سرویس پاک‌سازی خودکار کش"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F5F7FA"
              android:gravity="center_horizontal"
              android:layoutDirection="rtl"
              android:orientation="vertical"
              android:padding="20dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="پاک‌ساز سریع کش تبلت (v1.3)" android:textColor="#1E293B" android:textSize="20sp" android:textStyle="bold" />
              <LinearLayout android:layout_width="190dp" android:layout_height="190dp" android:layout_marginTop="20dp" android:background="@android:drawable/dialog_holo_light_frame" android:gravity="center" android:orientation="vertical">
                  <TextView android:id="@+id/tvTotalCache" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="0 MB" android:textColor="#0284C7" android:textSize="30sp" android:textStyle="bold" />
                  <TextView android:id="@+id/tvAppCount" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:text="آماده محاسبه" android:textColor="#64748B" android:textSize="14sp" />
              </LinearLayout>
              <CheckBox
                  android:id="@+id/cbSkipBale"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:checked="true"
                  android:text="نادیده گرفتن برنامه «بله» (جلوگیری از هنگ)"
                  android:textColor="#334155"
                  android:textSize="14sp" />
              <TextView android:id="@+id/tvStatus" android:layout_width="match_parent" android:layout_height="0dp" android:layout_marginTop="12dp" android:layout_weight="1" android:gravity="center" android:text="برای شروع، ابتدا کش برنامه‌ها را محاسبه کنید." android:textColor="#334155" android:textSize="15sp" />
              <Button android:id="@+id/btnScan" android:layout_width="match_parent" android:layout_height="55dp" android:backgroundTint="#0284C7" android:text="۱. محاسبه حافظه کش" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" />
              <Button android:id="@+id/btnClean" android:layout_width="match_parent" android:layout_height="55dp" android:layout_marginTop="10dp" android:backgroundTint="#16A34A" android:enabled="false" android:text="۲. پاک‌سازی خودکار همه کش‌ها" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/cachecleaner/CacheClearService.kt
          package com.example.cachecleaner

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.Rect
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class CacheClearService : AccessibilityService() {

              companion object {
                  var instance: CacheClearService? = null
                  var isRunning = false
                  var onFinished: (() -> Unit)? = null
              }

              private val handler = Handler(Looper.getMainLooper())
              private var queue = mutableListOf<String>()
              private var currentIndex = 0
              private var step = 0 // 0: Find Storage, 1: Find Clear Cache, 2: Done

              private val storageTitles = listOf(
                  "Storage", "Storage & cache", "Storage and cache",
                  "حافظه", "محل ذخیره", "فضای ذخیره‌سازی", "فضای ذخیره سازی",
                  "ذخیره‌سازی", "ذخیره سازی", "حافظه و کش", "محل ذخیره و حافظه پنهان"
              )

              private val forbiddenWords = listOf(
                  "Permission", "Permissions", "مجوز", "مجوزها", "دسترسی", "دسترسی‌ها", "دسترسی ها"
              )

              private val clearCacheWords = listOf(
                  "Clear cache", "CLEAR CACHE",
                  "پاک کردن حافظه پنهان", "پاک کردن کش", "پاکسازی حافظه پنهان",
                  "پاک‌سازی حافظه پنهان", "پاک کردن داده‌های پنهان", "پاک کردن داده های پنهان"
              )

              private val timeoutRunnable = Runnable {
                  if (isRunning) {
                      moveToNextApp()
                  }
              }

              private val pollRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      checkScreenAndAct()
                      handler.postDelayed(this, 450)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (instance == this) instance = null
              }

              fun startBatchClean(packages: List<String>) {
                  queue.clear()
                  queue.addAll(packages)
                  currentIndex = 0
                  isRunning = true
                  openCurrentAppSettings()
              }

              private fun openCurrentAppSettings() {
                  if (currentIndex >= queue.size) {
                      isRunning = false
                      handler.removeCallbacks(timeoutRunnable)
                      handler.removeCallbacks(pollRunnable)
                      val intent = Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      }
                      startActivity(intent)
                      onFinished?.invoke()
                      return
                  }

                  val pkg = queue[currentIndex]
                  step = 0

                  val intent = Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                      data = Uri.parse("package:$pkg")
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                  }
                  startActivity(intent)

                  handler.removeCallbacks(timeoutRunnable)
                  handler.postDelayed(timeoutRunnable, 5500)

                  handler.removeCallbacks(pollRunnable)
                  handler.postDelayed(pollRunnable, 650)
              }

              private fun checkScreenAndAct() {
                  val root = rootInActiveWindow ?: return

                  // ۱. بررسی وجود دکمه Clear Cache در صفحه فعلی
                  val cacheNode = findClearCacheNode(root)
                  if (cacheNode != null && step != 2) {
                      step = 2
                      clickNodeOrTap(cacheNode)
                      handler.removeCallbacks(timeoutRunnable)
                      handler.removeCallbacks(pollRunnable)
                      handler.postDelayed({ moveToNextApp() }, 750)
                      return
                  }

                  // ۲. اگر در مرحله اول هستیم، دقیقاً دنبال عنوان Storage بگرد (نه زیرنویس Permissions!)
                  if (step == 0) {
                      val storageNode = findExactStorageNode(root)
                      if (storageNode != null) {
                          step = 1
                          clickNodeOrTap(storageNode)
                      }
                  }
              }

              private fun findClearCacheNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  for (w in clearCacheWords) {
                      val list = root.findAccessibilityNodeInfosByText(w)
                      if (!list.isNullOrEmpty()) {
                          for (node in list) {
                              val text = node.text?.toString()?.trim() ?: ""
                              val desc = node.contentDescription?.toString()?.trim() ?: ""
                              if (text.equals(w, ignoreCase = true) || desc.equals(w, ignoreCase = true)) {
                                  return node
                              }
                          }
                      }
                  }
                  return null
              }

              private fun findExactStorageNode(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null

                  val text = node.text?.toString()?.trim() ?: ""
                  val viewId = node.viewIdResourceName ?: ""

                  // بررسی اینکه متن دقیقاً یکی از عناوین حافظه باشد (بدون کاما یا کلمات اضافی زیرنویس مجوزها)
                  if (text.isNotEmpty() && storageTitles.any { it.equals(text, ignoreCase = true) }) {
                      // مطمئن شویم که این یک زیرنویس (summary) نیست و در ردیف مجوزها (Permissions) قرار ندارد
                      if (!viewId.contains("summary", ignoreCase = true) && !isRowContainingForbiddenWords(node.parent)) {
                          return node
                      }
                  }

                  for (i in 0 until node.childCount) {
                      val found = findExactStorageNode(node.getChild(i))
                      if (found != null) return found
                  }
                  return null
              }

              private fun isRowContainingForbiddenWords(rowNode: AccessibilityNodeInfo?): Boolean {
                  if (rowNode == null) return false
                  for (i in 0 until rowNode.childCount) {
                      val child = rowNode.getChild(i) ?: continue
                      val childText = child.text?.toString() ?: ""
                      if (forbiddenWords.any { childText.contains(it, ignoreCase = true) }) {
                          return true
                      }
                  }
                  return false
              }

              private fun moveToNextApp() {
                  handler.removeCallbacks(timeoutRunnable)
                  handler.removeCallbacks(pollRunnable)
                  currentIndex++
                  openCurrentAppSettings()
              }

              private fun clickNodeOrTap(node: AccessibilityNodeInfo) {
                  var current: AccessibilityNodeInfo? = node
                  while (current != null) {
                      if (current.isClickable && current.isEnabled) {
                          if (current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                              return
                          }
                      }
                      current = current.parent
                  }

                  val rect = Rect()
                  node.getBoundsInScreen(rect)
                  if (!rect.isEmpty && rect.centerX() > 0 && rect.centerY() > 0) {
                      val path = Path().apply { moveTo(rect.centerX().toFloat(), rect.centerY().toFloat()) }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, 80))
                          .build()
                      dispatchGesture(gesture, null, null)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { isRunning = false }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/cachecleaner/MainActivity.kt
          package com.example.cachecleaner

          import android.app.AppOpsManager
          import android.app.usage.StorageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import android.os.storage.StorageManager
          import android.provider.Settings
          import android.text.format.Formatter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {
              private lateinit var tvTotalCache: TextView
              private lateinit var tvAppCount: TextView
              private lateinit var tvStatus: TextView
              private lateinit var cbSkipBale: CheckBox
              private lateinit var btnScan: Button
              private lateinit var btnClean: Button
              private val appsWithCache = mutableListOf<String>()
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvTotalCache = findViewById(R.id.tvTotalCache)
                  tvAppCount = findViewById(R.id.tvAppCount)
                  tvStatus = findViewById(R.id.tvStatus)
                  cbSkipBale = findViewById(R.id.cbSkipBale)
                  btnScan = findViewById(R.id.btnScan)
                  btnClean = findViewById(R.id.btnClean)

                  btnScan.setOnClickListener {
                      if (!hasUsageStatsPermission()) {
                          tvStatus.text = "لطفاً دسترسی Usage Access را به برنامه بدهید."
                          startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                      } else { scanCaches() }
                  }

                  btnClean.setOnClickListener {
                      val service = CacheClearService.instance
                      if (!isAccessibilityEnabled() || service == null) {
                          tvStatus.text = "لطفاً سرویس «پاک‌سازی خودکار کش» را در Accessibility روشن کنید."
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } else {
                          btnScan.isEnabled = false
                          btnClean.isEnabled = false
                          tvStatus.text = "در حال پاک‌سازی خودکار... لطفاً صبر کنید."
                          CacheClearService.onFinished = {
                              mainHandler.post {
                                  tvStatus.text = "پاک‌سازی تمام شد! در حال محاسبه مجدد..."
                                  scanCaches()
                              }
                          }
                          service.startBatchClean(appsWithCache)
                      }
                  }
              }

              private fun scanCaches() {
                  btnScan.isEnabled = false
                  btnClean.isEnabled = false
                  tvStatus.text = "در حال اسکن حافظه پنهان برنامه‌ها..."
                  appsWithCache.clear()
                  val skipBale = cbSkipBale.isChecked

                  thread {
                      val storageStatsManager = getSystemService(Context.STORAGE_STATS_SERVICE) as StorageStatsManager
                      val packages = packageManager.getInstalledApplications(PackageManager.GET_META_DATA)
                      var totalCacheBytes = 0L

                      for (app in packages) {
                          val pkg = app.packageName
                          if (pkg == packageName || pkg == "com.android.settings" || pkg == "com.android.systemui") continue
                          if (skipBale && (pkg.contains("bale", ignoreCase = true) || pkg == "ir.nasim")) continue

                          try {
                              val stats = storageStatsManager.queryStatsForPackage(StorageManager.UUID_DEFAULT, pkg, Process.myUserHandle())
                              if (stats.cacheBytes > 100 * 1024) {
                                  totalCacheBytes += stats.cacheBytes
                                  appsWithCache.add(pkg)
                              }
                          } catch (e: Exception) { }
                      }

                      mainHandler.post {
                          tvTotalCache.text = Formatter.formatFileSize(this, totalCacheBytes)
                          tvAppCount.text = "${appsWithCache.size} برنامه دارای کش"
                          btnScan.isEnabled = true
                          if (appsWithCache.isNotEmpty()) {
                              btnClean.isEnabled = true
                              tvStatus.text = "محاسبه تمام شد. آماده پاک‌سازی خودکار!"
                          } else { tvStatus.text = "تبلت شما کاملاً تمیز است!" }
                      }
                  }
              }

              private fun hasUsageStatsPermission(): Boolean {
                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName)
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val prefString = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                  return prefString?.contains("$packageName/${CacheClearService::class.java.name}") == true
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LenovoCacheCleaner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
